[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "second-look-backend"
version = "0.1.0"
description = "Second Look: bounded, inspectable football tactical investigations on synthetic data."
requires-python = ">=3.12,<3.13"
# Exact versions tested locally (see requirements.lock); Vercel installs from this list.
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "numpy==2.5.4",
    "agent-framework-foundry==1.15.0",
    "azure-identity==1.27.0",
    "agent-framework-foundry-local==1.0.0b261015",
    "json-repair==0.64.2",
]

[project.optional-dependencies]
dev = [
    "uvicorn[standard]==0.54.0",
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
